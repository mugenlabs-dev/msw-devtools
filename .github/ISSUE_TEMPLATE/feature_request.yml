name: Feature request
description: Suggest a new feature or adapter.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The API or behaviour you have in mind, and any alternatives you considered.
    validations:
      required: true

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs only read the repo. Deploys authenticate with VERCEL_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 65.1.0

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: bash scripts/ci-changed.sh test

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci-changed.sh gha

      # Runs here because README-only changes skip the other jobs.
      - name: npm README in sync
        run: node scripts/sync-readme.mjs --check

  check:
    name: 🔍 Lint & Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      - name: Lint & Format
        run: pnpm lint

      # GHSA-vfj7-8cjw-p6xm is ignored in package.json pnpm.auditConfig.ignoreGhsas.
      # The advisory is in @changesets/cli, not in the published dist.
      # pnpm audit has no --filter; --dir does not limit a workspace audit.
      # scripts/audit-published.sh keeps only packages/core production paths.
      - name: Audit published package
        run: pnpm audit:published

      - name: Audit workspace (non-blocking)
        continue-on-error: true
        run: pnpm audit:workspace

      - name: Run unit tests
        run: pnpm test:ci

      - name: Script tests
        run: bash scripts/audit-published.test.sh

  storybook:
    name: 📖 Storybook Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      # Ships Chromium and its system dependencies. Keep the tag in sync with
      # the Playwright version in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      # Runs the unit tests too, so coverage covers both projects
      - name: Run Storybook tests with coverage
        run: pnpm test:coverage

  peers:
    name: 🔢 Peer versions (${{ matrix.peers }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    # Unit + Storybook + typecheck + a small e2e app; keep headroom over ~5–6 min median.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # oldest 2.x, latest 2.x, latest 3.x (see scripts/pin-peer-versions.mjs)
        peers: [oldest, latest-2, latest-3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Pin peer dependencies
        run: node scripts/pin-peer-versions.mjs ${{ matrix.peers }}

      - run: pnpm install --no-frozen-lockfile

      # E2E apps resolve the workspace package from dist/. Build emits JS+DTS;
      # PersistedDocument narrowing keeps oldest @urql/core typecheck green.
      - name: Build library
        run: pnpm build

      - name: Typecheck core
        run: pnpm exec tsgo -p packages/core --noEmit

      # msw 2.0 can't be imported as `msw/browser` under Node, and this test
      # imports it (mocked), so the oldest leg skips it.
      - name: Unit tests
        run: pnpm test:ci ${{ matrix.peers == 'oldest' && '--exclude "**/worker-manager.test.ts"' || '' }}

      - name: Storybook tests
        run: pnpm test-storybook

      # MSW 2 legs run the non-deployed msw2 app; MSW 3 runs the live demo e2e.
      - name: Playwright e2e
        run: |
          if [ "${{ matrix.peers }}" = "latest-3" ]; then
            pnpm test:e2e
          else
            pnpm test:e2e:msw2
          fi
        env:
          CI: true

  build:
    name: 📦 Build & Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Check package exports
        run: pnpm lint:package

      - name: Typecheck
        run: pnpm exec tsgo -p packages/core --noEmit && pnpm exec tsgo -p apps/demo --noEmit

  changeset:
    name: 📝 Changeset
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require changeset when packages/core changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-changeset.sh "$BASE_SHA" "$HEAD_SHA"

  e2e-local:
    name: 🎭 E2E Tests (local)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    container:
      # Ships Chromium and its system dependencies. Keep the tag in sync with
      # the Playwright version in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      - name: Run E2E tests (local webServer)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-pr
          path: playwright-report/
          retention-days: 14

  deploy-preview:
    name: 🚀 Deploy Preview
    runs-on: ubuntu-latest
    needs: [changes, check, storybook, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    timeout-minutes: 4
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g "vercel@$VERCEL_CLI_VERSION"

      # The Vercel CLI reads VERCEL_TOKEN from the environment. It is set per step,
      # so the token stays off command lines and away from `pnpm install` scripts.
      # Production env, so `vercel build --prod` bakes in VITE_PUBLIC_POSTHOG_KEY
      # and promote ships this exact build instead of rebuilding it.
      - run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview (skip production alias)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --skip-domain)
          echo "preview-url=$url" >> "$GITHUB_OUTPUT"

  e2e:
    name: 🎭 E2E Tests
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      # Ships Chromium and its system dependencies. Keep the tag in sync with
      # the Playwright version in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - run: pnpm install --frozen-lockfile

      - name: Run E2E tests against preview
        run: pnpm test:e2e
        env:
          CI: true
          BASE_URL: ${{ needs.deploy-preview.outputs.preview-url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  promote:
    name: 👑 Promote to Production
    runs-on: ubuntu-latest
    needs: [e2e, deploy-preview]
    timeout-minutes: 2
    env:
      PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview-url }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - run: npm add -g "vercel@$VERCEL_CLI_VERSION"
      - name: Promote preview to production
        run: vercel promote "$PREVIEW_URL" --yes --scope="$VERCEL_ORG_ID"

  # Publishes only after the same commit passed CI, the preview e2e, and promote.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [promote]
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: npm exchanges this OIDC token for a publish token.
      id-token: write
    # Never run two releases at once, and never cancel one mid-publish.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing (OIDC) needs npm 11.5.1+, which Node 24 bundles.
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release PR or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="noindex" name="robots">
    <title>Page not found · @mugenlabs/msw-devtools</title>
    <style>
    :root {
      --bg: #0a0a0a;
      --text: #fff;
      --muted: #888;
      --border: #333;
      --accent: #6cb6ff;
      color-scheme: dark;
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    main {
      max-width: 28rem;
      padding: 1.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    p {
      margin: 0.75rem 0 0;
      font-size: 0.875rem;
      color: var(--muted);
    }
    a {
      display: inline-block;
      padding: 0.5rem 1rem;
      margin-top: 1.5rem;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
    }
    a:hover {
      border-color: var(--accent);
    }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There is nothing at this address on the Mugenlabs msw-devtools demo.</p>
      <p>
        Try the
        <a href="/">docs homepage</a>
        or
        <a href="/playground">playground</a>.
      </p>
    </main>
  </body>
</html>

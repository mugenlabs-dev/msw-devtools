<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · @mugenlabs/msw-devtools</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --text: #fff;
        --muted: #888;
        --border: #333;
        --accent: #6cb6ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: 0.875rem;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        color: var(--text);
        text-decoration: none;
      }
      a:hover {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There is nothing at this address on the Mugenlabs msw-devtools demo.</p>
      <p>
        Try the
        <a href="/">docs homepage</a>
        or
        <a href="/playground">playground</a>.
      </p>
    </main>
  </body>
</html>
